name: Multi-Tenant Merchant Admin & POS Flutter Build

on:
  repository_dispatch:
    types: [generate_merchant_app]
  workflow_dispatch:
    inputs:
      store_domain:
        description: 'Default Merchant Store Domain'
        required: true
        default: 'nextlook.shop.xylotechsolution.com'
      app_name:
        description: 'Branded Admin App Name'
        required: true
        default: 'Xylo Merchant Admin & POS'
      primary_color:
        description: 'Primary Brand Hex Color'
        required: true
        default: '#059669'

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Enable Android & Get Packages
        run: |
          flutter config --enable-android
          flutter create . --project-name xylo_merchant_admin --org com.xylosaas
          flutter pub get
      - name: Build Signed Merchant Admin Android APK
        run: |
          DOMAIN="${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'nextlook.shop.xylotechsolution.com' }}"
          SUB="${{ github.event.client_payload.subdomain || 'nextlook' }}"
          COLOR="${{ github.event.client_payload.primary_color || github.event.inputs.primary_color || '#059669' }}"
          flutter build apk --release             --dart-define=DEFAULT_TENANT_DOMAIN=$DOMAIN             --dart-define=TENANT_SUBDOMAIN=$SUB             --dart-define=PRIMARY_COLOR="$COLOR"             --dart-define=IS_MERCHANT_ADMIN=true
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-admin-pos-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_windows_exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Enable Windows & Get Packages
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --project-name xylo_merchant_admin
          flutter pub get
      - name: Build Windows POS Executable (.exe)
        run: |
          DOMAIN="${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'nextlook.shop.xylotechsolution.com' }}"
          SUB="${{ github.event.client_payload.subdomain || 'nextlook' }}"
          flutter build windows --release             --dart-define=DEFAULT_TENANT_DOMAIN=$DOMAIN             --dart-define=TENANT_SUBDOMAIN=$SUB             --dart-define=IS_MERCHANT_ADMIN=true
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-admin-pos-windows-exe
          path: build/windows/x64/runner/Release/

  build_apple_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Prepare iOS & Get Packages
        run: |
          flutter create . --platforms=ios --project-name xylo_merchant_admin --org com.xylosaas
          flutter pub get
      - name: Build iOS Admin IPA (No Codesign)
        run: |
          DOMAIN="${{ github.event.client_payload.store_domain || github.event.inputs.store_domain || 'nextlook.shop.xylotechsolution.com' }}"
          SUB="${{ github.event.client_payload.subdomain || 'nextlook' }}"
          flutter build ios --release --no-codesign             --dart-define=DEFAULT_TENANT_DOMAIN=$DOMAIN             --dart-define=TENANT_SUBDOMAIN=$SUB             --dart-define=IS_MERCHANT_ADMIN=true
